name: fractals_workspace
publish_to: none

environment:
  sdk: ">=3.13.7 <4.0.0"

dev_dependencies:
  melos: ^8.6.0

workspace:
  - apps/*
  - packages/*

melos:
  scripts:
    format: dart format .
    analyze: dart analyze

    # run tests in all packages
    test: >
      melos exec -c 1 --fail-fast --dir-exists=test -- \
        flutter test --no-pub

    # Check building on linux, android, web (WebAssembly)
    docker-check: >
      docker compose -f docker/docker-compose.yml run --rm check-linux &&
      docker compose -f docker/docker-compose.yml run --rm check-android &&
      docker compose -f docker/docker-compose.yml run --rm check-web

    # Build service images before starting the check containers.
    docker-check-build: >
      docker compose -f docker/docker-compose.yml run --build --rm check-linux &&
      docker compose -f docker/docker-compose.yml run --build --rm check-android &&
      docker compose -f docker/docker-compose.yml run --build --rm check-web

    # run the main Flutter app in debug mode
    dev: >
      melos exec --scope=fractals -- \
        flutter run -d macos --no-pub
